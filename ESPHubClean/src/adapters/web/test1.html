<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تجربة إرسال GET</title>
</head>
<body>

    <form action="/search" method="get">

        <label for="q">كلمة البحث:</label>
        <input type="text" id="q" name="query" value="HTML Form">

        <label for="cat">القسم:</label>
        <select id="cat" name="category">
            <option value="web" selected>تطوير الويب</option>
            <option value="design">التصميم</option>
        </select>

        <button type="submit">بحث</button>

    </form>

</body>
</html>
