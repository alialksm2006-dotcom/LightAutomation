<!-- <th></th> صنف جديد  -->
 <!-- tr صف جديد 
 td خانه جدیدة -->


<!DOCTYPE html> 
<html> 
    <head>
<style>
    body
{   
     font-family:Arial;
     padding:20px;
     background-color: #070c13;
} 
th, td {
    padding: 12px;
    text-align: left;
    border-bottom: 1px solid #ddd;
}
th{
    color :white;
    background-color: #4CAF50;
}
table {
    width: 100%;
    border-collapse: collapse;
    background-color: white;
}

tr:hover{
    background-color: #f1f1f1;
}
</style>
    </head>

    <body>
        <table border =1>
           <tr>
          <th>test1</th>
          <th>test2</th>
          <th>test3</th>
          </tr> 
            </th>
            <tr>
                <td><u1>
                    <li>
                        1
                    </li>
                    <li>
                        2
                    </li>
                    
                </u1></td>
                <td>2</td>
                <td>3</td>
            </tr>
            <tr>
                <td>new cell 1</td>
                <td>new cell 2</td>
            </tr>

        </table>
    </body>
</html>
