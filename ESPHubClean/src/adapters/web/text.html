<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Home Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ================== GLOBAL ================== */
/* النجمة تعني تحديد جميع العناصر في الصفحة 
أي قاعدة توضع هنا ستطبق على كل شيء: <div>, <p>, <h1>, <button>… */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    display: flex;
}

/* ================== SIDEBAR ================== */
.sidebar {
    width: 250px;
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(20px);
    height: 100vh;
    padding: 20px;
    border-right: 1px solid rgba(255,255,255,0.1);
}

.sidebar h2 {
    margin-bottom: 30px;
    color: #38bdf8;
}

.sidebar ul {
    list-style: none;
}

.sidebar li {
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.5s;
}

.sidebar li:hover {
    background: rgba(255,255,255,0.1);
    transform: scale(1.05);
}

/* ================== MAIN ================== */
.main {
    flex: 1;
    padding: 20px;
}

/* ================== TOPBAR ================== */
.topbar {
    display: flex;
    justify-content: space-between;
    margin-bottom: 20px;
}

.status {
    color: #22c55e;
}

/* ================== BUTTON ================== */
.btn {
    padding: 10px 16px;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg,#38bdf8,#6366f1);
    color: white;
    transition: 0.3s;
}

.btn:hover {
    transform: scale(1.05);
}

/* ================== GRID ================== */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill,minmax(250px,1fr));
    gap: 20px;
}

/* ================== CARD ================== */
.card {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    transition: 0.3s;
    position: relative;
}

.card:hover {
    transform: translateY(-5px);
}

.card.active {
    box-shadow: 0 0 20px #22c55e;
}

/* ================== TOGGLE ================== */
.switch {
    width: 50px;
    height: 25px;
    background: gray;
    border-radius: 50px;
    position: relative;
    cursor: pointer;
}

.switch::after {
    content: "";
    width: 20px;
    height: 20px;
    background: white;
    position: absolute;
    top: 2.5px;
    left: 3px;
    border-radius: 50%;
    transition: 0.3s;
}

.switch.active {
    background: #22c55e;
}

.switch.active::after {
    left: 26px;
}

/* ================== MODAL ================== */
.modal {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.7);
    display:none;
    align-items:center;
    justify-content:center;
}

.modal-content {
    background:#111827;
    padding:20px;
    border-radius:15px;
    width:300px;
}

/* ================== TOAST ================== */
.toast {
    position: fixed;
    bottom:20px;
    right:20px;
    background:#22c55e;
    padding:10px 20px;
    border-radius:10px;
    display:none;
}

</style>
</head>

<body>

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>Smart Home</h2>
    <ul>
        <li>Dashboard</li>
        <li>Devices</li>
        <li>Rooms</li>
    </ul>
</div>

<!-- MAIN -->
<div class="main">

    <!-- TOPBAR -->
    <div class="topbar">
        <h2>Devices</h2>
        <div>
            <span class="status">● Connected</span>
            <button class="btn" onclick="openModal()">+ Add Device</button>
        </div>
    </div>

    <!-- GRID -->
    <div class="grid" id="deviceGrid"></div>
</div>

<!-- MODAL -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h3>Add Device</h3>
        <input id="name" placeholder="Device Name"><br><br>
        <input id="room" placeholder="Room"><br><br>
        <button class="btn" onclick="addDevice()">Save</button>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

/* ================== DATA ================== */
let devices = [
    {id:0,name:"Light 1",room:"Living Room",state:false},
    {id:1,name:"Light 2",room:"Bedroom",state:true}
];

/* ================== RENDER ================== */
function render() {
    const grid = document.getElementById("deviceGrid");
    grid.innerHTML = "";

    devices.forEach(d => {
        let card = document.createElement("div");
        card.className = "card " + (d.state ? "active":"");

        card.innerHTML = `
            <h3>${d.name}</h3>
            <p>${d.room}</p>
            <br>
            <div class="switch ${d.state?"active":""}" onclick="toggle(${d.id})"></div>
            <br>
            <button onclick="deleteDevice(${d.id})">Delete</button>
        `;

        grid.appendChild(card);
    });
}

/* ================== TOGGLE ================== */
function toggle(id){
    let d = devices.find(x=>x.id===id);
    d.state = !d.state;

    showToast(d.name + (d.state?" ON":" OFF"));

    // 🔥 هنا تربط مع ESP32
    fetch(`/device/toggle?id=${id}&state=${d.state}`);

    render();
}

/* ================== ADD ================== */
function addDevice(){
    let name = document.getElementById("name").value;
    let room = document.getElementById("room").value;

    let id = Date.now();

    devices.push({id,name,room,state:false});

    fetch("/device/add",{
        method:"POST",
        body: JSON.stringify({id,name,room})
    });

    closeModal();
    render();
}

/* ================== DELETE ================== */
function deleteDevice(id){
    devices = devices.filter(d=>d.id!==id);

    fetch(`/device/delete?id=${id}`);

    render();
}

/* ================== MODAL ================== */
function openModal(){
    document.getElementById("modal").style.display="flex";
}

function closeModal(){
    document.getElementById("modal").style.display="none";
}

/* ================== TOAST ================== */
function showToast(msg){
    let t = document.getElementById("toast");
    t.innerText = msg;
    t.style.display="block";

    setTimeout(()=>t.style.display="none",2000);
}

/* INIT */
render();

</script>

</body>
</html>
